name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung package mirror once held this job for 40 minutes; fail and let it be re-run instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
        timeout-minutes: 5
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo clippy -p reelhouse-app --features web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo binstall -y dioxus-cli@0.7.10
      - run: dx build --platform web --features web --release
        working-directory: apps/reelhouse
