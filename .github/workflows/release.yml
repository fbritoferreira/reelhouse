name: Release

# On every push to main: release-please keeps a release PR up to date, and the image for this
# commit is built and pushed as sha-<commit> and main. When the push is a merged release PR, the
# same image is also tagged with the version, so a release never rebuilds.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.sha }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please bumps the version in Cargo.toml only; bring the workspace's entries in
      # Cargo.lock along on the open release PR, or every build of the release rewrites the
      # lockfile. Every push, not only when release-please changes the PR: it leaves the PR
      # alone for commits that add nothing to the changelog.
      - uses: actions/checkout@v4
      - env:
          BRANCH: release-please--branches--main--components--reelhouse
        run: |
          git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null || exit 0
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD
          cargo update --workspace
          if ! git diff --quiet Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync Cargo.lock with the release version"
            git push origin "HEAD:$BRANCH"
          fi

  image:
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push sha-${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag the release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          MINOR: ${{ needs.release-please.outputs.minor }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$MAJOR.$MINOR" -t "$IMAGE:latest" \
            "$IMAGE:sha-$GITHUB_SHA"
