[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/fbritoferreira/reelhouse"

[workspace.dependencies]
dioxus = "=0.7.10"
reelhouse-api = { path = "crates/reelhouse-api" }
reelhouse-core = { path = "crates/reelhouse-core" }
reelhouse-ui = { path = "crates/reelhouse-ui" }
