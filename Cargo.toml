[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/fbritoferreira/reelhouse"

[workspace.dependencies]
dioxus = "=0.7.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reelhouse-api = { path = "crates/reelhouse-api" }
reelhouse-core = { path = "crates/reelhouse-core" }
reelhouse-ui = { path = "crates/reelhouse-ui" }

# Dioxus 0.7.10's manganis refuses to compile for 32-bit Android, which the Google TV Streamer
# runs. The patched copy only removes that guard (patches/manganis/src/android/callback.rs).
[patch.crates-io]
manganis = { path = "patches/manganis" }
