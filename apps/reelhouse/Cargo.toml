[package]
name = "reelhouse-app"
description = "The Reelhouse app for web, Android and Google TV."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router"] }
reelhouse-api = { workspace = true }
reelhouse-core = { workspace = true }
futures-timer = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Storage", "Location", "HtmlMediaElement", "HtmlVideoElement", "MediaError"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "android")'.dependencies]
manganis = "=0.7.10"

[features]
default = []
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]
