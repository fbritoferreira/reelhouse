[package]
name = "player-proto"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "=0.7.10" }
futures-timer = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlMediaElement", "HtmlVideoElement", "MediaError"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
manganis = "=0.7.10"

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
